name: Sync Maggi

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout our repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure Git identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Add Maggi remote
        run: |
          git remote add maggi https://github.com/MaggiCoder16/Tasty-MAGGI.git || echo "Maggi Bot already added"
          git fetch maggi main

      - name: Merge Maggi into our repo
        run: |
          git merge maggi/main --allow-unrelated-histories -X ours --no-edit || true
          git merge maggi/main -X ours --no-edit || true
          git commit -am "Sync Maggi updates (ours wins on conflicts)" || echo "No changes to commit"

      - name: Push changes
        run: git push origin main
